# CI: Guards, Tests, beide Images, und auf Verlangen die Veroeffentlichung.
#
# Gebaut wird bei jedem Push. GEPUSHT wird nur bei einem Versions-Tag (v*)
# oder bei einem Klick auf "Run workflow" mit gesetztem Haken -- und nur nach
# einem gruenen Lauf. Eine App, die nie gruen war, gehoert in keine Registry.
#
# Die ghcr-Pakete sind beim ersten Push privat, auch in einem oeffentlichen
# Repo. Ohne einmaliges Umstellen auf Public endet die Installation auf der
# Box in registry_error.
#
# Beide Images werden mit dem Repo-Wurzelverzeichnis als Baukontext gebaut,
# weil db/schema.sql von Web und Worker gemeinsam gelesen wird.

name: ci

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Images nach ghcr veroeffentlichen'
        type: boolean
        default: false

jobs:
  guards:
    name: check-chart.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Der Guard vergleicht neue Werteschluessel gegen den letzten Tag.
          # Ohne Historie ueberspringt er die Pruefung.
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: check-chart.sh
        run: ./scripts/check-chart.sh

      - name: icon.png ist reproduzierbar
        run: |
          python3 scripts/make-icon.py
          git diff --exit-code -- icon.png

  worker-tests:
    name: Worker-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ffmpeg und libsndfile
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: librosa
        # Nur fuer die Beat-Tests. Ohne librosa ueberspringen sie sich, dann
        # waere aber niemand da, der sie je laufen laesst.
        working-directory: worker
        run: pip install -r requirements.txt

      - name: Tests
        working-directory: worker
        run: python3 -m unittest discover -s tests -t . --verbose

  web-typecheck:
    name: Web-Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Abhaengigkeiten
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: tsc
        working-directory: web
        run: npm run typecheck

      - name: Bauen
        working-directory: web
        run: npm run build

  worker-image:
    name: Worker-Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag aus Chart.yaml lesen
        id: version
        run: |
          # Der Image-Tag haengt an appVersion, nicht an values.yaml.
          tag="$(grep -E '^appVersion:' move/Chart.yaml | awk '{print $2}')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Tag: $tag"

      - name: Bauen
        run: docker build -f worker/Dockerfile -t "moveworker:${{ steps.version.outputs.tag }}" .

      - name: ffmpeg im Image
        run: |
          img="moveworker:${{ steps.version.outputs.tag }}"
          # Die Version gehoert ins Log: xfade zaehlt in 5.1 anders als in
          # 6.1, und das hat den Schnitt schon einmal um ein Bild verschoben.
          docker run --rm --entrypoint ffmpeg "$img" -hide_banner -version | head -1
          docker run --rm --entrypoint ffmpeg "$img" -hide_banner -filters \
            | awk '$2=="drawtext"{gefunden=1} END{exit !gefunden}'
          docker run --rm --entrypoint sh "$img" -c 'test -f "$MOVE_FONT_FILE"'

      - name: Schema ist im Image und stimmt mit dem Repo ueberein
        run: |
          img="moveworker:${{ steps.version.outputs.tag }}"
          docker run --rm --entrypoint cat "$img" /app/db/schema.sql > /tmp/im-image.sql
          diff -u db/schema.sql /tmp/im-image.sql

      - name: Nicht als root
        run: |
          uid="$(docker run --rm --entrypoint id "moveworker:${{ steps.version.outputs.tag }}" -u)"
          test "$uid" = "1000" || { echo "laeuft als UID $uid, erwartet 1000"; exit 1; }

      - name: Testsuite im gebauten Image
        run: |
          # tests/ liegt bewusst nicht im Image. Fuer den Lauf wird es
          # eingehaengt, damit genau das geprueft wird, was ausgeliefert wird.
          docker run --rm \
            -v "$PWD/worker/tests:/app/tests:ro" \
            --entrypoint python3 \
            "moveworker:${{ steps.version.outputs.tag }}" \
            -m unittest discover -s tests -t .

      - name: Schnittgrenzen im Image messen
        # Laeuft auch wenn die Suite rot war -- gerade dann. Eine Datei kann
        # die richtige Laufzeit haben und trotzdem an der falschen Stelle
        # schneiden; dann sagt nur diese Messung, wo die Grenzen liegen.
        if: always()
        run: |
          docker run --rm \
            -v "$PWD/worker/tools:/app/tools:ro" \
            --entrypoint python3 \
            "moveworker:${{ steps.version.outputs.tag }}" \
            tools/schnittgrenzen.py --template examples/beat-8s.json

      - name: Ein Job von Anfang bis Ende
        run: |
          img="moveworker:${{ steps.version.outputs.tag }}"
          mkdir -p /tmp/movedata && chmod 777 /tmp/movedata
          docker run --rm -v /tmp/movedata:/app/data "$img" \
            enqueue --template /app/examples/beat-8s.json
          docker run --rm -v /tmp/movedata:/app/data "$img" \
            work --max-jobs 1 --width 320 --height 180
          docker run --rm -v /tmp/movedata:/app/data "$img" jobs | tee /tmp/jobs.txt
          grep -q 'done *1' /tmp/jobs.txt || { echo "kein fertiger Job"; exit 1; }
          ls -la /tmp/movedata/renders/

  web-image:
    name: Web-Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag aus Chart.yaml lesen
        id: version
        run: |
          tag="$(grep -E '^appVersion:' move/Chart.yaml | awk '{print $2}')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Bauen
        run: docker build -f web/Dockerfile -t "move:${{ steps.version.outputs.tag }}" .

      - name: Nicht als root, lauscht auf 0.0.0.0
        run: |
          img="move:${{ steps.version.outputs.tag }}"
          uid="$(docker run --rm --entrypoint id "$img" -u)"
          test "$uid" = "1000" || { echo "laeuft als UID $uid, erwartet 1000"; exit 1; }
          # Das standalone-Image lauscht nur auf $HOSTNAME.
          host="$(docker run --rm --entrypoint printenv "$img" HOSTNAME)"
          test "$host" = "0.0.0.0" || { echo "HOSTNAME=$host, erwartet 0.0.0.0"; exit 1; }

      - name: Schema ist im Image und stimmt mit dem Repo ueberein
        run: |
          img="move:${{ steps.version.outputs.tag }}"
          docker run --rm --entrypoint cat "$img" /app/db/schema.sql > /tmp/im-image.sql
          diff -u db/schema.sql /tmp/im-image.sql

      - name: Keine eingebrannte Build-Adresse
        run: |
          # NEXT_PUBLIC_* und rewrites()-Ziele lassen sich nach dem Build nicht
          # mehr aendern. Das Bundle darf deshalb keine enthalten.
          img="move:${{ steps.version.outputs.tag }}"
          docker run --rm --entrypoint printenv "$img" | grep -i '^NEXT_PUBLIC' \
            && { echo "NEXT_PUBLIC_* im Image gesetzt"; exit 1; } || true

      - name: Server starten und Zeitlimit pruefen
        run: |
          img="move:${{ steps.version.outputs.tag }}"
          mkdir -p /tmp/webdata && chmod 777 /tmp/webdata
          docker run -d --name moveweb -p 3000:3000 -v /tmp/webdata:/app/data "$img"
          for i in $(seq 1 30); do
            curl -sf localhost:3000/api/health >/dev/null && break
            sleep 1
          done
          curl -sf localhost:3000/api/health | tee /tmp/health.json
          echo
          # Nodes Vorgabe waere 300000. Der --require-Patch muss greifen,
          # sonst endet ein langsamer Upload in HTTP 408.
          docker logs moveweb 2>&1 | grep -F '[server-zeitlimit]' | tee /tmp/zeitlimit.txt
          grep -q 'requestTimeout=7200000ms' /tmp/zeitlimit.txt \
            || { echo "requestTimeout nicht angehoben"; exit 1; }

      - name: Upload ueber 10 MB kommt VOLLSTAENDIG an
        run: |
          # Der teuerste gemessene Fehler des Projekts: liegt /api/uploads im
          # Matcher der Middleware, kappt Next 15.5 den Strom bei rund 10 MB
          # UND meldet HTTP 200. Aus 20.000.000 Bytes wurden 10.449.920, und
          # die Datei sah vollstaendig aus.
          #
          # Dieser Schritt ist der Regressionstest dafuer.
          { printf '\x00\x00\x00\x20ftypisom'; head -c 19999988 /dev/urandom; } > /tmp/gross.mp4
          ls -l /tmp/gross.mp4
          antwort="$(curl -s -X POST --data-binary @/tmp/gross.mp4 \
            'localhost:3000/api/uploads?name=gross.mp4')"
          echo "$antwort"
          echo "$antwort" | grep -q '"bytes":20000000' \
            || { echo "Upload kam NICHT vollstaendig an"; docker logs moveweb; exit 1; }

      - name: Aufraeumen
        if: always()
        run: docker rm -f moveweb 2>/dev/null || true

  chart-paket:
    name: Chart-Paket
    # Laeuft bei jedem Push, damit ein Packfehler nicht erst am Release
    # auffaellt. Das Ergebnis haengt als Artefakt am Lauf: die Market Source
    # ist ein eigenes Repo, und diese beiden Dateien sind alles, was sie von
    # hier braucht.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: paket.sh
        run: ./scripts/paket.sh

      - name: Version lesen
        id: version
        run: echo "v=$(grep -E '^version:' move/Chart.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: chart-${{ steps.version.outputs.v }}
          path: |
            dist/move-${{ steps.version.outputs.v }}.tgz
            dist/move-${{ steps.version.outputs.v }}.tgz.base64
            dist/markteintrag.json
          if-no-files-found: error

  publish:
    name: Images nach ghcr
    # Nur nach einem gruenen Lauf. Eine App, die nie gruen war, gehoert in
    # keine Registry.
    needs: [guards, worker-tests, web-typecheck, worker-image, web-image, chart-paket]
    # Nicht bei jedem Push. Entweder ein Versions-Tag oder ein bewusster
    # Klick auf "Run workflow" mit gesetztem Haken.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event.inputs.push_images == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag aus Chart.yaml lesen
        id: version
        run: |
          # Der Image-Tag haengt an appVersion. Kein `latest` -- ein rollender
          # Tag ist nicht reproduzierbar, und das Chart leitet den Tag aus
          # .Chart.AppVersion ab.
          tag="$(grep -E '^appVersion:' move/Chart.yaml | awk '{print $2}')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "veroeffentliche Tag: $tag"

      - name: Bei ghcr anmelden
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Worker-Image
        run: |
          ref="ghcr.io/${{ github.repository_owner }}/moveworker:${{ steps.version.outputs.tag }}"
          docker build -f worker/Dockerfile -t "$ref" .
          docker push "$ref"
          echo "$ref"

      - name: Web-Image
        run: |
          ref="ghcr.io/${{ github.repository_owner }}/move:${{ steps.version.outputs.tag }}"
          docker build -f web/Dockerfile -t "$ref" .
          docker push "$ref"
          echo "$ref"

      - name: Hinweis zur Sichtbarkeit
        run: |
          echo "Die Pakete sind beim ersten Push privat, auch in einem"
          echo "oeffentlichen Repo. Die Installation auf der Box endet dann in"
          echo "registry_error. Einmalig umstellen unter:"
          echo "  https://github.com/${{ github.repository_owner }}?tab=packages"
          echo "  -> Paket -> Package settings -> Change visibility -> Public"
