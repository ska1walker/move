# marktpr.yml — move in die AImighty Market Source eintragen und dort einen
# Pull Request oeffnen.
#
# NUR AUF KNOPFDRUCK. Kein Push-Trigger, kein Zeitplan: dieser Workflow
# schreibt in ein FREMDES Repo. Das soll ein bewusster Klick sein, keine
# Nebenwirkung eines Commits.
#
# Was er tut:
#   1. Chart mit echtem helm packen (scripts/paket.sh)
#   2. Eintrag in eine frische Kopie der Market Source setzen
#      (scripts/marktpatch.sh -- typecheckt dort gegen die Grundlinie)
#   3. Branch pushen und einen Pull Request oeffnen
#
# Was er NICHT tut: auf main pushen, mergen, deployen. Das Deploy
# (wrangler pages deploy) bleibt bei dem, dem das Cloudflare-Konto gehoert --
# ein Commit ohne Deploy aendert am Katalog nichts, aber ein Deploy aendert,
# was jede synchronisierende Box sieht.
#
# WARUM DIESER WEG UND NICHT EIN SCHLUESSEL IM CHAT:
# Ein Token, das durch eine Unterhaltung geht, steht danach in einem
# Verlauf und ist zu erneuern. Als Actions-Secret ist es verschluesselt
# gespeichert, wird im Log maskiert und laesst sich zurueckziehen, ohne dass
# irgendwo eine Kopie liegen bleibt. Ausserdem entsteht das Chart hier im
# SELBEN Lauf, in dem der Eintrag geschrieben wird -- das muss so sein, denn
# helm package ist ueber Laeufe hinweg nicht bitgleich (die Dateizeiten
# kommen aus dem Checkout).
#
# EINRICHTUNG, einmalig:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     Name:  MARKT_TOKEN
#     Wert:  ein KLASSISCHES PAT mit genau einem Scope: public_repo.
#
#   BEIDES GEHT, der Workflow fragt das Token selbst:
#     - Ein Token von Marc, das in bayerhazard/aimighty-market schreiben
#       darf -> Branch direkt dorthin.
#     - Ein eigenes Token -> Branch in den Fork ska1walker/aimighty-market,
#       Pull Request ueber die Fork-Grenze.
#   Verwechseln kann man es nicht: der Schritt "Weg bestimmen" fragt
#   `repos/<quelle>.permissions.push` und sagt im Log, welchen Weg er nimmt.
#
#   Warum klassisch und nicht feingranular: ein feingranulares Token laesst
#   sich nur auf EIGENE Repos beschraenken -- der Pull Request entsteht aber
#   gegen ein fremdes. `public_repo` ist der kleinste Scope, der beides kann,
#   und er erreicht keine privaten Repos. Beide Repos sind oeffentlich.
#
#   Wessen Token drinsteht, entscheidet auch, wer als Autor erscheint. Marcs
#   Token heisst: Branch und Pull Request kommen unter seinem Namen.

name: marktpr

on:
  workflow_dispatch:
    inputs:
      trockenlauf:
        description: 'Nur vorbereiten, nicht pushen und keinen PR oeffnen'
        type: boolean
        default: true
      mergen:
        description: 'Den offenen Pull Request mergen (umgeht das Review des Repo-Eigners)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  marktpr:
    name: Pull Request in der Market Source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Token pruefen
        # Frueh und mit Klartext-Befund. Ohne diesen Schritt zeigte sich ein
        # ungueltiges Token erst beim Push, als
        #   "remote: Invalid username or token"
        # -- und davor hatte die Rechteabfrage stillschweigend `false`
        # geliefert, also den Fork-Weg gewaehlt. Zwei Fehlbilder aus einer
        # Ursache. Wer wissen will, WARUM, braucht es hier.
        if: ${{ inputs.trockenlauf == false }}
        env:
          GH_TOKEN: ${{ secrets.MARKT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Das Secret MARKT_TOKEN ist nicht gesetzt."
            echo "Settings -> Secrets and variables -> Actions -> MARKT_TOKEN"
            exit 1
          fi

          if ! wer="$(gh api user --jq .login 2>&1)"; then
            echo "Das Token wird von GitHub ABGELEHNT. Antwort:"
            echo "  $wer"
            echo
            echo "Haeufigste Ursachen, in dieser Reihenfolge:"
            echo "  - abgelaufen oder widerrufen"
            echo "  - beim Einfuegen verstuemmelt (Leerzeichen, Zeilenumbruch)"
            echo "  - ein feingranulares Token ohne Zugriff auf diese Repos"
            exit 1
          fi
          echo "Token gehoert zu: $wer"

          for r in bayerhazard/aimighty-market ska1walker/aimighty-market; do
            p="$(gh api "repos/$r" --jq '.permissions.push // false' 2>/dev/null || echo "kein Zugriff")"
            echo "  Schreibrecht auf $r: $p"
          done

      - name: PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Chart packen
        run: ./scripts/paket.sh

      - name: Weg bestimmen und Branch anlegen
        # ZWEI WEGE, und welcher gilt, haengt am Token -- nicht an einer
        # Vereinbarung. Deshalb wird es GEFRAGT statt angenommen:
        #
        #   Token mit Schreibrecht auf die Quelle (z. B. eines von Marc)
        #     -> Branch direkt in bayerhazard/aimighty-market, PR von dort.
        #   Token ohne dieses Recht (Kais eigenes)
        #     -> Branch in den Fork ska1walker/aimighty-market, PR ueber die
        #        Fork-Grenze. So beschreibt es beacons docs/BETRIEB.md:
        #        "Kai hat dort nur Leserechte -- der Weg ist Fork, Branch,
        #        Pull Request an Marc."
        #
        # Der falsche Weg faellt sonst erst beim Push auf, nach allem Packen.
        # Und der Fork-Weg mit MARCS Token scheitert genauso: sein Token darf
        # in SEIN Repo schreiben, nicht in Kais Fork.
        #
        # Abgezweigt wird immer von upstream/main, nie vom Fork-Stand: der
        # Fork lag gemessen 62 Commits hinter der Quelle. Ein Eintrag auf dem
        # alten Stand waere ein PR, der 62 fremde Aenderungen zurueckdreht.
        id: weg
        env:
          GH_TOKEN: ${{ secrets.MARKT_TOKEN || github.token }}
        run: |
          version="$(grep -E '^version:' move/Chart.yaml | awk '{print $2}')"
          QUELLE=bayerhazard/aimighty-market
          FORK=ska1walker/aimighty-market

          darf="$(gh api "repos/$QUELLE" --jq '.permissions.push // false' 2>/dev/null || echo false)"
          if [ "$darf" = "true" ]; then
            ziel="$QUELLE"
            kopf="move-$version"
            echo "Das Token darf in $QUELLE schreiben -- direkter Weg."
          else
            ziel="$FORK"
            kopf="ska1walker:move-$version"
            echo "Kein Schreibrecht auf $QUELLE -- Weg ueber den Fork $FORK."
          fi
          echo "ziel=$ziel" >> "$GITHUB_OUTPUT"
          echo "kopf=$kopf" >> "$GITHUB_OUTPUT"
          echo "branch=move-$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          git clone "https://github.com/$ziel" dist/markt
          cd dist/markt
          if [ "$ziel" != "$QUELLE" ]; then
            git remote add upstream "https://github.com/$QUELLE"
            git fetch --depth 50 upstream main
            basis=upstream/main
            echo "Fork: $(git rev-parse --short HEAD)"
          else
            basis=origin/main
          fi
          echo "Quelle: $(git rev-parse --short $basis)"
          git checkout -q -B "move-$version" "$basis"
          echo "Branch move-$version zweigt von $(git rev-parse --short $basis) ab."

          npm install --no-save --no-audit --no-fund \
            typescript@5.7.3 @cloudflare/workers-types@4.20250430.0

      - name: Eintrag setzen und typechecken
        run: ./scripts/marktpatch.sh dist/markt

      - name: Was entstanden ist
        run: git -C dist/markt show --stat --oneline HEAD | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: marktpatch
          path: dist/*.patch
          if-no-files-found: error

      - name: Branch pushen und Pull Request oeffnen
        if: ${{ inputs.trockenlauf == false }}
        env:
          GH_TOKEN: ${{ secrets.MARKT_TOKEN }}
        run: |
          # Die Pruefung steht ABSICHTLICH hier und nicht am Anfang: so
          # entsteht der Patch als Artefakt auch dann, wenn das Secret noch
          # fehlt. Ein Lauf, der nichts hinterlaesst, hilft niemandem.
          if [ -z "$GH_TOKEN" ]; then
            echo "Das Secret MARKT_TOKEN fehlt -- nicht gepusht, kein PR."
            echo "Der Patch haengt trotzdem als Artefakt 'marktpatch' an diesem Lauf"
            echo "und ist mit 'git am' anwendbar."
            echo
            echo "Einrichten: Settings -> Secrets and variables -> Actions"
            echo "  Name  MARKT_TOKEN"
            echo "  Wert  feingranulares Token nur fuer bayerhazard/aimighty-market,"
            echo "        Contents und Pull requests auf Read and write."
            exit 1
          fi

          version="${{ steps.weg.outputs.version }}"
          branch="${{ steps.weg.outputs.branch }}"
          kopf="${{ steps.weg.outputs.kopf }}"

          gh auth setup-git
          # origin ist das, was der vorige Schritt bestimmt hat: die Quelle
          # oder der Fork.
          echo "Push nach ${{ steps.weg.outputs.ziel }}, PR-Kopf $kopf"
          # --force-with-lease, weil ein zweiter Lauf sonst scheitert: der
          # Branch wird jedesmal frisch von upstream/main abgezweigt, und
          # `helm package` ist ueber Laeufe hinweg nicht bitgleich -- der
          # Commit hat also eine andere Id bei gleichem Inhalt, und ein
          # normaler Push waere non-fast-forward. Ueberschrieben wird nur ein
          # Branch, den dieser Workflow selbst angelegt hat; --with-lease
          # sorgt dafuer, dass fremde Commits darauf den Push stoppen.
          git -C dist/markt push --force-with-lease -u origin "$branch"

          # Schon offen? Dann hat der Push gereicht, ein zweiter PR waere
          # Rauschen. Beim Fork-Weg ist der Kopf <eigner>:<branch>.
          offen="$(gh pr list --repo bayerhazard/aimighty-market \
                     --head "$kopf" --state open --json number --jq 'length')"
          if [ "$offen" != "0" ]; then
            echo "Es gibt bereits einen offenen PR fuer $branch. Der Push hat ihn aktualisiert."
            exit 0
          fi

          cat > /tmp/pr.md <<'TEXT'
          Neue App: `move`, Kategorie Utilities, ein Entrance auf Port 3000.

          Schnitt-Templates als Zeitstempel. Ein Template ist kein Modell,
          sondern eine Liste von Zeitpunkten; angewendet wird deterministisch
          mit ffmpeg. Die Pipeline laeuft ohne einen einzigen Modellaufruf
          durch.

          ## Was sich aendert

          Zwei Dateien, mehr braucht es nicht:

          | Datei | Aenderung |
          |---|---|
          | `functions/_apps.ts` | App-Eintrag, zwischen zwei Markerzeilen |
          | `functions/_lib.ts` | eine Zeile im `CHARTS`-Dict |

          Nachgesehen in `functions/api/v1/applications/[app]/chart.ts`: der
          Endpunkt liest allein aus dem `CHARTS`-Dict. Der `charts/`-Ordner
          wird nicht angefasst.

          ## Wie der Eintrag entstanden ist

          Erzeugt aus dem `OlaresManifest.yaml` der App, nicht abgeschrieben.
          Die Markerzeilen sagen das, weil `_apps.ts` in Zeile 1
          `// Generated by gen_market.py` traegt: **der Block gehoert
          mittelfristig in diesen Generator**, nicht in Handpflege.

          Chart und Eintrag stammen aus demselben CI-Lauf. Das ist
          notwendig, nicht Zufall: `helm package` ist ueber Laeufe hinweg
          nicht bitgleich, weil die Dateizeiten aus dem Checkout kommen.

          ## Gepruefte Punkte

          - `tsc` gegen die Grundlinie dieses Repos: gleiche Fehlerzahl vorher
            und nachher, der Eintrag bringt keinen neuen.
          - `check-chart.sh` besteht, bevor ueberhaupt gepackt wird.
          - Der gepackte Tarball wird auf Inhalt geprueft; das base64 wird
            zurueckdekodiert und byteweise gegen den Tarball verglichen.
          - Nur einmal gzippt (sonst meldet die Box `invalid tar header`).

          ## Danach noch zu tun

          Nach dem Merge **deployen** (`wrangler pages deploy functions/`) --
          ein Commit ohne Deploy aendert am Katalog nichts. Dann den Sync
          abwarten.

          Drei `envs` fragt die App bei der Installation ab, alle optional:
          `FAL_KEY` (password), `MOVE_FAL_MODEL`, `MOVE_FAL_MAX_CLIPS` (int,
          Vorgabe 12). Ohne Schluessel laeuft sie mit Platzhaltern und eigenen
          Uploads.

          ---
          _Erzeugt von [Claude Code](https://claude.com/claude-code)_
          TEXT

          gh pr create --repo bayerhazard/aimighty-market \
            --base main \
            --head "$kopf" \
            --title "move $version in den Katalog" \
            --body-file /tmp/pr.md

      - name: Pull Request mergen
        # Eigener Haken, weil das den Review des Repo-Eigners UMGEHT. Der PR
        # ist der Ort, an dem er die Aenderung sieht; ein Merge von aussen
        # nimmt ihm diesen Schritt ab, ob er will oder nicht.
        if: ${{ inputs.trockenlauf == false && inputs.mergen == true }}
        env:
          GH_TOKEN: ${{ secrets.MARKT_TOKEN }}
        run: |
          QUELLE=bayerhazard/aimighty-market
          kopf="${{ steps.weg.outputs.kopf }}"

          nr="$(gh pr list --repo "$QUELLE" --head "$kopf" --state open \
                  --json number --jq '.[0].number // empty')"
          if [ -z "$nr" ]; then
            echo "Kein offener Pull Request fuer $kopf. Nichts zu mergen."
            exit 0
          fi
          echo "Pull Request #$nr"

          # Nicht raten, welche Merge-Art das Repo erlaubt -- fragen. Ein
          # `gh pr merge --squash` gegen ein Repo, das nur Merge-Commits
          # zulaesst, scheitert mit einer Meldung, die wie ein Rechteproblem
          # aussieht.
          erlaubt="$(gh api "repos/$QUELLE" \
            --jq '[(if .allow_rebase_merge then "--rebase" else empty end),
                   (if .allow_squash_merge then "--squash" else empty end),
                   (if .allow_merge_commit then "--merge"  else empty end)] | .[0] // empty')"
          if [ -z "$erlaubt" ]; then
            echo "Das Repo erlaubt keine der drei Merge-Arten -- von Hand mergen."
            exit 1
          fi
          echo "Merge-Art: $erlaubt"

          gh pr merge "$nr" --repo "$QUELLE" $erlaubt
          echo "#$nr ist gemergt."

          # Nachmessen statt der Meldung glauben: steht der Eintrag jetzt im
          # Standardbranch?
          git -C dist/markt fetch -q origin main
          if git -C dist/markt show origin/main:functions/_lib.ts \
               | grep -q "\"move-${{ steps.weg.outputs.version }}.tgz\""; then
            echo "Bestaetigt: move-${{ steps.weg.outputs.version }}.tgz liegt im Standardbranch."
          else
            echo "WARNUNG: der Merge wurde gemeldet, aber im Standardbranch steht der Eintrag nicht."
            exit 1
          fi

      - name: Trockenlauf-Hinweis
        if: ${{ inputs.trockenlauf == true }}
        run: |
          echo "Trockenlauf: nichts gepusht, kein PR."
          echo "Der Patch haengt als Artefakt 'marktpatch' an diesem Lauf."
          echo "Fuer den echten Lauf den Haken bei 'Nur vorbereiten' ENTFERNEN"
          echo "und vorher das Secret MARKT_TOKEN setzen."
