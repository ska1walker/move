# OlaresManifest.yaml — move
#
# Diese Datei liegt zweimal byteweise identisch im Repo: hier im Chart und im
# Repo-Root. Der Store liest das Root-Manifest, die Installation das
# Chart-Manifest. scripts/check-chart.sh vergleicht beide, sonst driftet die
# Kopie still.
#
# Aenderungen hier IMMER in beide Dateien. Und jede Aenderung braucht eine neue
# Version — der Katalog-Hash entsteht aus ID:name:version, eine reine
# Textaenderung loest keinen Re-Sync aus.

olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

# Pflicht, oberste Ebene. Beide Deployments werden hier aufgefuehrt; die
# Templates lesen den Wert ueber .Values.workloads.<name>.replicaCount, weil
# app-service mit 0 rendert und danach hochskaliert.
workloadReplicas:
  move: 1
  moveworker: 1

metadata:
  name: move
  appid: move
  icon: https://raw.githubusercontent.com/ska1walker/move/main/icon.png
  title: Move
  version: 26.9.8
  description: Cut templates as timestamps, applied deterministically with ffmpeg
  categories:
    - Utilities

# Genau EIN Entrance. Ein zweiter wuerde die Adresse des ersten aendern, und
# der Worker braucht ohnehin keinen: er spricht nie HTTP, sondern pollt die
# Job-Tabelle.
entrances:
  - name: move
    port: 3000
    host: move
    title: Move
    icon: https://raw.githubusercontent.com/ska1walker/move/main/icon.png
    openMethod: window
    authLevel: private

spec:
  versionName: 26.9.8
  fullDescription: |
    Move builds videos from cut templates.

    **Cut templates** A cut template is not a model. It is a list of
    timestamps: cut points, pacing, transition kinds and a beat grid,
    extracted statistically from a reference clip and stored as JSON.

    **Assembly** The assembler takes one cut template plus N clips and renders
    a finished MP4 with ffmpeg. The edit is arithmetic, not inference: cut
    points land on the frame the plan names, and the same template with the
    same clips produces the same file byte for byte on a given ffmpeg build.

    **Uploads** Source footage is uploaded by the user. Move ships no
    downloader.

    **Resource usage** CPU only. No GPU is requested in this version.
  upgradeDescription: |
    26.9.8: A reference image per shot, and the page now follows the workflow.

    Until now an image could only hang on a figure. A figure is the right tool
    for one thing -- the same person across several shots -- and the wrong one
    for the other: giving every scene its own motif meant creating one figure
    per photo, so "figure" came to mean "photo". Each shot now has its own
    image field. Both together is the useful case: the figure carries the
    description and the seed, the shot's image wins as the visual reference.
    The more specific one wins, so the person stays the same while the motif
    changes.

    A shot's image also selects the image-to-video endpoint, exactly as a
    figure's image does. Without that the call would go to a text-to-video
    model that has no image parameter -- billed, and the image ignored.

    The image is uploaded when the job is created, not when it is picked, so
    abandoning the form leaves nothing behind. Uploads run before the job is
    queued: a failed upload means no job and no paid call.

    Page order: "Figures" now comes before "Create job". The per-shot figure
    dropdown only appears once at least one figure exists, so the old order
    asked people to create a job and meet figures afterwards. The page follows
    the workflow now rather than the order the sections were written in.

    Also fixed, and it was a real hole: the worker resolved paths from the job
    row without confining them to the data directory, and the older branch for
    clip.uri even accepted absolute paths. The worker reads from the database,
    not from an HTTP request, so a row saying ../../etc/passwd was a file it
    would happily read -- and, for a reference image, upload to fal. Both
    fields are now confined, with tests that fail when the guard is removed;
    without it, measured, /etc/passwd reached a paid call.

    26.9.7: Corrects what move sends to fal.ai, measured against the client
    library and the model pages instead of assumed. Three of the assumptions
    held, two did not.

    Held: image_url and seed are the real argument names, and the call form
    subscribe(model, arguments=..., client_timeout=...) matches the actual
    signature of fal-client 1.0.1 -- the version this worker pins, checked
    against its source, not a similar one. A test now pins that signature and
    fails if the library changes it.

    Did not hold, and this one mattered: the built-in default model
    fal-ai/ltx-video is a text-to-video endpoint. It has no image parameter,
    so a figure with a reference image went to a model that could not use it.
    The call would have been billed and the face would have been different in
    every shot -- a failure that produces a video rather than an error. Shots
    with a reference image now go to an image-to-video endpoint
    (fal-ai/ltx-2/image-to-video by default, MOVE_FAL_BILD_MODEL to change
    it), and MOVE_FAL_MODEL deliberately does not apply to them.

    Also corrected: the shot length went out as a float. One model's own
    example sends it as the string "8", others want a whole number, some
    accept only fixed values. It now goes as a whole second, rounded up --
    rounding down would be billed and then rejected by the assembler, which
    requires a clip to be at least as long as its shot. Three environment
    switches cover the rest without a new image: MOVE_FAL_DAUER_ARGUMENT,
    MOVE_FAL_DAUER_TEXT, MOVE_FAL_DAUER_AUS.

    Smaller: FAL_KEY_ID plus FAL_KEY_SECRET now count as a key, because the
    client accepts them, and the secret is scrubbed from error messages the
    same way FAL_KEY already was.

    What is still not measured: no real call has been made. fal.ai is
    unreachable from the build environment, so the response shape and whether
    a reference image acts as the first frame remain unverified.

    26.9.6: Three sample templates, so the app is usable the moment it opens.
    Until now the first visit showed an empty page and a hint; a template had
    to be extracted from an uploaded video first. The worker now seeds three
    hand-written ones on start -- fast montage, trailer build, quiet sequence --
    each showing a different editing idea rather than different numbers. All
    three render to exactly their declared runtime: 8.000, 15.000 and 16.000
    seconds.

    Seeding never overwrites. Fixed ids, insert-if-absent: edit a sample and
    your version survives every restart and every upgrade. A broken sample
    file is logged and skipped rather than stopping the worker -- the job loop
    matters more than an example.

    The interface now answers three questions where they come up: where the
    fal.ai key goes (Olares app settings, never in move), where the prompt for
    a generated shot goes (one per shot, under "from fal.ai"), and how fal
    knows which model to use (it does not -- move passes the name, from the
    per-job field, else MOVE_FAL_MODEL, else fal-ai/ltx-video).

    26.9.5: Fixes a field that silently swallowed what you typed, and adds
    guidance on reference images. The name field of a figure was a controlled
    React input; the browser autofilled it, which sets the DOM value without
    firing a React change event, so the state stayed empty. The page showed
    "Kai" in the field and "the figure needs a name" underneath. Measured in
    a real browser, both ways. The text fields are now uncontrolled and read
    from the DOM, every text field carries autoComplete, and CI rejects one
    that does not.

    Also new: an expandable note on the figure form answering how many photos
    and which ones. Short version: one image is used, because one image_url
    goes to the model per call. Frontal, sharp, evenly lit, that person alone,
    wearing what should recur. Many image-to-video models use the reference as
    the first frame, in which case a neutral portrait is the better choice and
    variety comes from the per-shot prompt -- but that semantic is not
    measured here, since fal.ai is unreachable from the build environment.

    26.9.4: The interface can now do the whole job. Until this version a user
    had to run `move_worker extract` inside the worker pod to get a template
    at all, so the page showed nothing but a hint. New: upload an MP4 and the
    worker extracts the cut points from it; a figure carries a reference
    image, a description and a stable seed, so the same person can appear
    across several generated shots.

    On consistent characters, plainly: fal.ai remembers nothing between two
    calls. A person looks the same across shots only because every shot gets
    the same inputs. The reference image is the strong lever, the description
    is free but weak, the seed helps with some models. LoRA training stays
    out of scope.

    Schema: only new tables (upload, extract_job, figur). An existing
    database keeps its rows -- this file runs as executescript with
    CREATE TABLE IF NOT EXISTS, which cannot add a column to a table that
    already exists.

    26.9.3: Makes the app installable at all. The olares dependency was missing
    the field `type: system`, and without it a box refuses the install with
    "Incompatible with this Olares version" even though the version pin itself
    is correct and `chart lint` reports nothing. Measured against the
    catalogue, not guessed: of the 21 charts in the AImighty market source
    that install, 21 carry `type: system`; the only two without it were
    move 26.9.1 and 26.9.2. A guard now rejects a chart that omits it.

    26.9.2: Fixes a chart that could not install. In 26.9.1 a Go template trim
    marker swallowed the newline after a variable assignment, so the worker
    Deployment rendered without an apiVersion field and the API rejected it.
    Measured, not assumed: rendering the published 26.9.1 chart yields
    apiVersion=None for the moveworker Deployment. A guard now counts
    apiVersion and kind in the rendered output, not in the source.

    Also new: the web container learns whether a fal.ai key is configured
    (yes/no only, never the key itself), so a job asking for generated clips
    is refused up front with a plain message instead of being accepted and
    failing later in the worker.

    26.9.1: First release. Chart skeleton, single entrance, SQLite on appData.
    Deterministic cut assembler with placeholder clips. No model inference in
    this version. Built for Olares 1.12.6.
  developer: kaivo.studio
  submitter: kaivo.studio
  website: https://kaivo.studio
  sourceCode: https://github.com/ska1walker/move
  locale:
    - en
  supportArch:
    - amd64
  # Summe ALLER Container einschliesslich Init-Container muss hier
  # hineinpassen, sonst lehnt der Upload mit HTTP 400 ab. Gerechnet:
  #   requests  1220m / 2592Mi     limits  5200m / 9344Mi
  # ffmpeg und spaeter TransNetV2 sind bewusst grosszuegig angesetzt.
  requiredCpu: 2000m
  limitedCpu: 6000m
  requiredMemory: 4Gi
  limitedMemory: 12Gi
  requiredDisk: 20Gi

# appData ueberlebt die Deinstallation und traegt SQLite, Uploads,
# Zwischenclips und Renderergebnisse.
permission:
  appData: true

options:
  # 0, sonst kappt der Envoy-Sidecar jede Antwort nach 15 s — ein Render oder
  # ein grosser Upload laeuft laenger.
  apiTimeout: 0
  # String. Als Zahl oder Bool scheitert der Parser.
  runAsUser: "1000"
  # Fuer die Modellgewichte, die ab Schritt 8 (TransNetV2) geladen werden.
  allowedOutboundPorts:
    - 443
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      # type: system ist PFLICHT und fehlte hier. Ohne das Feld lehnt die Box
      # die Installation ab mit "Incompatible with this Olares version" --
      # obwohl der Pin selbst stimmt und obwohl `chart lint` nichts sagt.
      #
      # Weder CLAUDE.md noch docs/olares-learnings.md nennen das Feld; beide
      # zeigen die Abhaengigkeit nur mit name und version. Belegt ist es
      # stattdessen am Katalog: von den 21 Charts in Marcs Market Source, die
      # installieren, tragen 21 `type: system` -- insilo, beacon, relay,
      # aimragflow und alle uebrigen. Die einzigen beiden ohne waren
      # move-26.9.1 und move-26.9.2.
      type: system

# Was Olares bei der Installation abfragt.
#
# Gemessen an fuenf Apps im offiziellen Katalog (sillytavern, karakeep,
# firecrawl, flowise, openwebui), nicht geraten:
#
#   - Der Block steht in allen fuenf ZULETZT, nach options:. Die Reihenfolge
#     aus AGENTS.md (permission, envs, options) haelt keine von ihnen ein.
#   - Einen Anbieterschluessel, den Olares nicht selbst verwaltet, deklariert
#     man einfach mit `type: password` und OHNE valueFrom. valueFrom gibt es
#     nur fuer den geschlossenen Satz kontoweiter Olares-Einstellungen
#     (OPENAI_APIKEY, HUGGINGFACE_TOKEN und ein paar mehr) -- fuer fal gibt es
#     dort keinen Eintrag, also traegt der Nutzer den Schluessel hier ein.
#     Damit loest sich der Widerspruch: das Praefix jener Einstellungen kommt
#     in move gar nicht vor. Es steht hier auch bewusst nicht ausgeschrieben,
#     denn der Manifest-Pruefer durchsucht den rohen Dateitext danach.
#   - `type`-Werte, die im Katalog wirklich vorkommen: string, password, bool,
#     url, int. `default` immer als gequoteter String, auch bei int.
#
# ALLE Eintraege sind optional. Die Pipeline laeuft ohne einen einzigen
# Modellaufruf durch -- eine Installation, die nur Platzhalter und eigene
# Uploads will, darf nicht an einem fehlenden Schluessel haengen.
#
# Gelesen wird jeder Wert im Chart als (.Values.olaresEnv).<name>.
envs:
  - envName: FAL_KEY
    type: password
    required: false
    editable: true
    applyOnChange: true
    description: "Your own fal.ai API key, used to generate clips. fal bills per call against this key. Leave it empty to work with placeholder clips and your own uploads only: a job that asks for generated clips then fails with a plain message instead of silently doing nothing."
  - envName: MOVE_FAL_MODEL
    type: string
    required: false
    editable: true
    applyOnChange: true
    description: "Default fal.ai model for shots WITHOUT a reference image, for example fal-ai/ltx-video. Leave empty for the worker's built-in default. A single job can override it. This value deliberately does not apply to shots that carry a figure's reference image: fal-ai/ltx-video is a text-to-video endpoint and has no image parameter, so using it there would charge for the call and ignore the image."
  - envName: MOVE_FAL_BILD_MODEL
    type: string
    required: false
    editable: true
    applyOnChange: true
    description: "Default fal.ai model for shots WITH a reference image, for example fal-ai/ltx-2/image-to-video. Leave empty for the worker's built-in default. This has to be an image-to-video endpoint: it is the one that receives image_url, which is how a figure keeps the same face across shots."
  - envName: MOVE_FAL_MAX_CLIPS
    type: int
    required: false
    editable: true
    applyOnChange: true
    default: "12"
    description: "Most generated clips a single job may request. Checked before the first paid call, so an oversized job costs nothing. Set it to 0 to switch generation off entirely and allow placeholders and uploads only."
