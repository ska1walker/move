# Worker: Python 3.11, Extraktion und ffmpeg.
#
# Kein Entrance und kein Service. Der Envoy-Sidecar faengt jeden eingehenden
# TCP-Verkehr ab, auch clusterinternen — ein Aufruf vom eigenen Pod auf einen
# Entrance-Service endet in 401. Der Worker kommuniziert deshalb ausschliesslich
# ueber die Job-Tabelle. Das ist der Grund fuer das Polling, nicht Bequemlichkeit.
#
# Das Label ist bewusst app: moveworker, nicht app: move — mit app: move wuerde
# der Service des Frontends den Worker als Endpoint aufnehmen.
#
# $oe: die Nutzereingaben aus dem envs:-Block des Manifests. `| default dict`
# statt direkter Dereferenzierung, weil ein Markt-Upgrade die Werte der
# ERSTinstallation zurueckspielt — auf einer Bestandsbox fehlt der Block, und
# .Values.olaresEnv.X waere dort ein nil-Pointer. Dieselbe Form benutzt
# openwebui im offiziellen Katalog.
#
# LINKS trimmen, rechts NICHT. Hier stand `-}}`, und das war ein Fehler: die
# rechte Trimm-Marke frisst den Zeilenumbruch NACH der Zuweisung, und dann
# klebt `apiVersion: apps/v1` an das Ende der Kommentarzeile darueber. Das
# Deployment rendert damit OHNE apiVersion -- syntaktisch gueltiges YAML, also
# beschwert sich niemand, aber die API kann damit nichts anfangen.
# Gemessen mit text/template, nicht geraten:
#   `-}}`  ->  "# ... Katalog.apiVersion: apps/v1"
#   `}}`   ->  "# ... Katalog." / "apiVersion: apps/v1"
{{- $oe := .Values.olaresEnv | default dict }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moveworker
  labels:
    app: moveworker
spec:
  replicas: {{ (index .Values.workloads "moveworker").replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: moveworker
  template:
    metadata:
      labels:
        app: moveworker
    spec:
      initContainers:
        - name: init-appdata
          image: "docker.io/beclab/aboveos-busybox:1.37.0"
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            # db gehoert beiden: die Job-Tabelle ist der einzige Weg zwischen
            # Web und Worker. Wer zuerst startet, legt den Ordner an -- die
            # Reihenfolge der Pods ist nicht garantiert.
            - mkdir -p /app/data/db /app/data/work /app/data/renders && chown -R 1000:1000 /app/data/db /app/data/work /app/data/renders
          volumeMounts:
            - name: appdata
              mountPath: /app/data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: moveworker
          image: "ghcr.io/ska1walker/moveworker:{{ .Values.images.worker.tag | default .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          env:
            - name: MOVE_DATA_DIR
              value: /app/data
            # Ein Worker-Pod, ein Job zur Zeit. Die Queue nimmt den aeltesten
            # Job mit BEGIN IMMEDIATE und status='queued'.
            - name: MOVE_QUEUE_CONCURRENCY
              value: "1"
            - name: MOVE_POLL_INTERVAL_MS
              value: "2000"
            # Die vier Werte aus dem envs:-Block. Alle in derselben Form
            # gelesen: `hasKey` entscheidet, ob der Nutzer etwas gesetzt hat,
            # und NICHT `| default ""`.
            #
            # Der Grund steckt in MOVE_FAL_MAX_CLIPS und kostet Geld. 0 heisst
            # dort "Generierung aus". In Helm ist 0 aber leer im Sinne von
            # `default`, also machte `0 | default ""` daraus einen leeren Wert
            # — und ein leerer Wert ist im Worker bewusst die Vorgabe 12. Wer
            # abschaltet, bekaeme zwoelf bezahlte Aufrufe erlaubt. Dieselbe
            # Falle nennt CLAUDE.md fuer Booleans; sie gilt fuer Zahlen genauso.
            #
            # Fuer FAL_KEY und MOVE_FAL_MODEL waere `default ""` harmlos. Sie
            # stehen trotzdem in derselben Form: zwei Schreibweisen
            # nebeneinander laden dazu ein, beim naechsten env die falsche zu
            # kopieren.
            #
            # KORREKTUR EINER FRUEHEREN BEHAUPTUNG. Der else-Zweig steht als
            # eine Klammer mit leerem String und quote, nicht als nacktes "".
            # Begruendet hatte ich das mit "das literale "" steht ausserhalb
            # der Klammern und wird immer ausgegeben" -- das ist FALSCH.
            # Go-Templates steuern den Text zwischen if, else und end; darauf
            # beruht jedes Helm-Chart. Die Doppelausgabe kam aus dem
            # Minimal-Renderer, mit dem hier ohne helm geprueft wird, und ich
            # habe sie Helm zugeschrieben. Der Renderer kann es jetzt.
            # Die Form bleibt, weil sie eindeutig ist -- aber nicht, weil sie
            # noetig waere.
            #
            # UND DIESER KOMMENTAR HAT DAS CHART SCHON EINMAL GEBROCHEN. Er
            # nannte if, else und end in doppelten geschweiften Klammern, um
            # sie zu zitieren. Helm liest die Datei aber als Go-Template und
            # sieht keine YAML-Kommentare -- eine leere if-Klammer ist fuer
            # den Parser eine leere if-Klammer, auch hinter einem #:
            #   Error: parse error at (deployment-moveworker.yaml:94):
            #          missing value for if
            # Kein Kommentar in einer Template-Datei darf eine Aktion in
            # doppelten geschweiften Klammern zitieren. Namen ausschreiben.
            #
            # Der Schluessel selbst steht an keiner Stelle im Repo. Leer heisst
            # keine Generierung -- ein Job mit source 'fal' scheitert dann mit
            # Klartext, statt still nichts zu tun.
            - name: FAL_KEY
              value: {{ if hasKey $oe "FAL_KEY" }}{{ $oe.FAL_KEY | quote }}{{ else }}{{ "" | quote }}{{ end }}
            # Leer heisst: der Standard aus generierung.py. Gilt NUR fuer
            # Einstellungen OHNE Referenzbild -- siehe modell_fuer.
            - name: MOVE_FAL_MODEL
              value: {{ if hasKey $oe "MOVE_FAL_MODEL" }}{{ $oe.MOVE_FAL_MODEL | quote }}{{ else }}{{ "" | quote }}{{ end }}
            # Der Bildpfad hat sein eigenes Modell, und das ist kein Komfort:
            # der Standard fuer Text (fal-ai/ltx-video) ist ein
            # Text-zu-Video-Endpunkt und kennt image_url nicht. Wuerde
            # MOVE_FAL_MODEL auch hier gelten, entwertete ein Textmodell dort
            # still jede Figur mit Referenzbild -- bezahlt und wirkungslos.
            - name: MOVE_FAL_BILD_MODEL
              value: {{ if hasKey $oe "MOVE_FAL_BILD_MODEL" }}{{ $oe.MOVE_FAL_BILD_MODEL | quote }}{{ else }}{{ "" | quote }}{{ end }}
            # Leer heisst: DEFAULT_MAX_FAL_CLIPS aus runner.py. Ein Tippfehler
            # faellt dort nicht still auf die Vorgabe zurueck, sondern
            # scheitert.
            - name: MOVE_FAL_MAX_CLIPS
              value: {{ if hasKey $oe "MOVE_FAL_MAX_CLIPS" }}{{ $oe.MOVE_FAL_MAX_CLIPS | quote }}{{ else }}{{ "" | quote }}{{ end }}
          volumeMounts:
            - name: appdata
              mountPath: /app/data
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 8Gi
      volumes:
        - name: appdata
          hostPath:
            path: {{ .Values.userspace.appData }}
            type: DirectoryOrCreate
