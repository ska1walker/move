# OlaresManifest.yaml — move
#
# Diese Datei liegt zweimal byteweise identisch im Repo: hier im Chart und im
# Repo-Root. Der Store liest das Root-Manifest, die Installation das
# Chart-Manifest. scripts/check-chart.sh vergleicht beide, sonst driftet die
# Kopie still.
#
# Aenderungen hier IMMER in beide Dateien. Und jede Aenderung braucht eine neue
# Version — der Katalog-Hash entsteht aus ID:name:version, eine reine
# Textaenderung loest keinen Re-Sync aus.

olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

# Pflicht, oberste Ebene. Beide Deployments werden hier aufgefuehrt; die
# Templates lesen den Wert ueber .Values.workloads.<name>.replicaCount, weil
# app-service mit 0 rendert und danach hochskaliert.
workloadReplicas:
  move: 1
  moveworker: 1

metadata:
  name: move
  appid: move
  icon: https://raw.githubusercontent.com/ska1walker/move/main/icon.png
  title: Move
  version: 26.9.3
  description: Cut templates as timestamps, applied deterministically with ffmpeg
  categories:
    - Utilities

# Genau EIN Entrance. Ein zweiter wuerde die Adresse des ersten aendern, und
# der Worker braucht ohnehin keinen: er spricht nie HTTP, sondern pollt die
# Job-Tabelle.
entrances:
  - name: move
    port: 3000
    host: move
    title: Move
    icon: https://raw.githubusercontent.com/ska1walker/move/main/icon.png
    openMethod: window
    authLevel: private

spec:
  versionName: 26.9.3
  fullDescription: |
    Move builds videos from cut templates.

    **Cut templates** A cut template is not a model. It is a list of
    timestamps: cut points, pacing, transition kinds and a beat grid,
    extracted statistically from a reference clip and stored as JSON.

    **Assembly** The assembler takes one cut template plus N clips and renders
    a finished MP4 with ffmpeg. The edit is arithmetic, not inference: cut
    points land on the frame the plan names, and the same template with the
    same clips produces the same file byte for byte on a given ffmpeg build.

    **Uploads** Source footage is uploaded by the user. Move ships no
    downloader.

    **Resource usage** CPU only. No GPU is requested in this version.
  upgradeDescription: |
    26.9.3: Makes the app installable at all. The olares dependency was missing
    the field `type: system`, and without it a box refuses the install with
    "Incompatible with this Olares version" even though the version pin itself
    is correct and `chart lint` reports nothing. Measured against the
    catalogue, not guessed: of the 21 charts in the AImighty market source
    that install, 21 carry `type: system`; the only two without it were
    move 26.9.1 and 26.9.2. A guard now rejects a chart that omits it.

    26.9.2: Fixes a chart that could not install. In 26.9.1 a Go template trim
    marker swallowed the newline after a variable assignment, so the worker
    Deployment rendered without an apiVersion field and the API rejected it.
    Measured, not assumed: rendering the published 26.9.1 chart yields
    apiVersion=None for the moveworker Deployment. A guard now counts
    apiVersion and kind in the rendered output, not in the source.

    Also new: the web container learns whether a fal.ai key is configured
    (yes/no only, never the key itself), so a job asking for generated clips
    is refused up front with a plain message instead of being accepted and
    failing later in the worker.

    26.9.1: First release. Chart skeleton, single entrance, SQLite on appData.
    Deterministic cut assembler with placeholder clips. No model inference in
    this version. Built for Olares 1.12.6.
  developer: kaivo.studio
  submitter: kaivo.studio
  website: https://kaivo.studio
  sourceCode: https://github.com/ska1walker/move
  locale:
    - en
  supportArch:
    - amd64
  # Summe ALLER Container einschliesslich Init-Container muss hier
  # hineinpassen, sonst lehnt der Upload mit HTTP 400 ab. Gerechnet:
  #   requests  1220m / 2592Mi     limits  5200m / 9344Mi
  # ffmpeg und spaeter TransNetV2 sind bewusst grosszuegig angesetzt.
  requiredCpu: 2000m
  limitedCpu: 6000m
  requiredMemory: 4Gi
  limitedMemory: 12Gi
  requiredDisk: 20Gi

# appData ueberlebt die Deinstallation und traegt SQLite, Uploads,
# Zwischenclips und Renderergebnisse.
permission:
  appData: true

options:
  # 0, sonst kappt der Envoy-Sidecar jede Antwort nach 15 s — ein Render oder
  # ein grosser Upload laeuft laenger.
  apiTimeout: 0
  # String. Als Zahl oder Bool scheitert der Parser.
  runAsUser: "1000"
  # Fuer die Modellgewichte, die ab Schritt 8 (TransNetV2) geladen werden.
  allowedOutboundPorts:
    - 443
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      # type: system ist PFLICHT und fehlte hier. Ohne das Feld lehnt die Box
      # die Installation ab mit "Incompatible with this Olares version" --
      # obwohl der Pin selbst stimmt und obwohl `chart lint` nichts sagt.
      #
      # Weder CLAUDE.md noch docs/olares-learnings.md nennen das Feld; beide
      # zeigen die Abhaengigkeit nur mit name und version. Belegt ist es
      # stattdessen am Katalog: von den 21 Charts in Marcs Market Source, die
      # installieren, tragen 21 `type: system` -- insilo, beacon, relay,
      # aimragflow und alle uebrigen. Die einzigen beiden ohne waren
      # move-26.9.1 und move-26.9.2.
      type: system

# Was Olares bei der Installation abfragt.
#
# Gemessen an fuenf Apps im offiziellen Katalog (sillytavern, karakeep,
# firecrawl, flowise, openwebui), nicht geraten:
#
#   - Der Block steht in allen fuenf ZULETZT, nach options:. Die Reihenfolge
#     aus AGENTS.md (permission, envs, options) haelt keine von ihnen ein.
#   - Einen Anbieterschluessel, den Olares nicht selbst verwaltet, deklariert
#     man einfach mit `type: password` und OHNE valueFrom. valueFrom gibt es
#     nur fuer den geschlossenen Satz kontoweiter Olares-Einstellungen
#     (OPENAI_APIKEY, HUGGINGFACE_TOKEN und ein paar mehr) -- fuer fal gibt es
#     dort keinen Eintrag, also traegt der Nutzer den Schluessel hier ein.
#     Damit loest sich der Widerspruch: das Praefix jener Einstellungen kommt
#     in move gar nicht vor. Es steht hier auch bewusst nicht ausgeschrieben,
#     denn der Manifest-Pruefer durchsucht den rohen Dateitext danach.
#   - `type`-Werte, die im Katalog wirklich vorkommen: string, password, bool,
#     url, int. `default` immer als gequoteter String, auch bei int.
#
# ALLE Eintraege sind optional. Die Pipeline laeuft ohne einen einzigen
# Modellaufruf durch -- eine Installation, die nur Platzhalter und eigene
# Uploads will, darf nicht an einem fehlenden Schluessel haengen.
#
# Gelesen wird jeder Wert im Chart als (.Values.olaresEnv).<name>.
envs:
  - envName: FAL_KEY
    type: password
    required: false
    editable: true
    applyOnChange: true
    description: "Your own fal.ai API key, used to generate clips. fal bills per call against this key. Leave it empty to work with placeholder clips and your own uploads only: a job that asks for generated clips then fails with a plain message instead of silently doing nothing."
  - envName: MOVE_FAL_MODEL
    type: string
    required: false
    editable: true
    applyOnChange: true
    description: "Default fal.ai video model, for example fal-ai/ltx-video. Leave empty to use the worker's built-in default. A single job can override it."
  - envName: MOVE_FAL_MAX_CLIPS
    type: int
    required: false
    editable: true
    applyOnChange: true
    default: "12"
    description: "Most generated clips a single job may request. Checked before the first paid call, so an oversized job costs nothing. Set it to 0 to switch generation off entirely and allow placeholders and uploads only."
